apiVersion: apps/v1
kind: Deployment
metadata:
  name: olympic-games-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olympic-games-app
  template:
    metadata:
      labels:
        app: olympic-games-app
    spec:
      containers:
      - name: olympic-games-app
        image: ghcr.io/elriccc/projet_4_front_end-front:1.1.0
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: regcred